name: Release

# Cuts the tag and the GitHub release from the conventional commits merged
# since the last tag. Nothing is committed, no branch is written, and the tag
# is created by the release call itself (target_commitish), so the job needs no
# git credentials and no push permission.
#
# A merge releases, and the release event runs publish.yml. That ordering needs
# the npm trusted publisher to exist first: without it a merge cuts a release
# whose publish job then fails, which is the half-finished release this tool
# exists to avoid. It is configured for @sasjs/release, so the trigger is on.
on:
  push:
    branches: [main]
  # a manual run releases whatever has been merged since the last tag
  workflow_dispatch:

permissions:
  contents: write # the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the range is classified from tags: a shallow clone sees one commit
          # and invents a version
          fetch-depth: 0
          # the release call creates the tag over the API, so the checkout
          # token does not need to stay in the git config
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Pin npm for audit integration tests
        run: |
          npm install --global --ignore-scripts npm@11.6.2
          npm --version

      # a defect must fail here rather than at release time
      - name: The suite
        run: node --test

      - name: Tag and release
        run: node release.mjs --host github --release --output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
