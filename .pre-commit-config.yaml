# Hooks for the pre-commit framework - https://pre-commit.com
#
# This repository had none, so no staged content was scanned for secrets at
# commit time while every other SASjs repository carried this file. The hook is
# pinned to an exact gitleaks release tag, as the siblings pin it.
#
# Install the framework once with `pre-commit install`, and the secret scan runs
# on every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
