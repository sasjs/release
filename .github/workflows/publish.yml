name: Publish

# Publishes the version the release names.
#
# This file is the one an npm trusted publisher is registered against, because
# the registry validates the workflow that actually runs `npm publish` (the OIDC
# `job_workflow_ref` claim) - not the workflow that triggered it. Keeping the
# publish here and the tag in release.yml means neither job holds the other's
# permission: the release job never sees `id-token`, and this job never sees
# `contents: write`.
#
# A `release: published` trigger does NOT work here, and it fails silently: a
# release created with the pipeline's own GITHUB_TOKEN fires no events, because
# GitHub suppresses them to stop recursion. The first run proved it - the
# release appeared and this workflow never started. workflow_run is not
# suppressed, so publishing is chained off the Release workflow finishing.
#
# Nothing is committed. The tag is the version; the version is stamped into the
# working tree because npm reads package.json, and the tree is thrown away.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # a publish that failed can be retried: the release event fires once, and
  # re-creating the release to republish is exactly the state to avoid
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish. Required when dispatched; when this runs from
          the Release workflow, leave it blank and the tag that run created is
          used. Must be on main.
        required: false
        default: ''
      republish:
        description: Publish even when the registry already serves this version
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # trusted publishing: the OIDC token is the credential

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # a fork must not publish to the org's package, and a release run that
    # failed has nothing to publish
    if: |
      github.repository == 'sasjs/release' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag is how this workflow learns what to publish: the release
          # run created it at the commit it released
          # Always main: a dispatch can name any ref, and the tag gate below
          # treats HEAD as the default branch. Publishing is from main or not at
          # all, so the checkout says so rather than inheriting the dispatcher's
          # choice.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::invalid or missing workflow run SHA"
              exit 1
            fi
            args=(--sha "$SHA")
          else
            if [ -z "$REQUESTED" ]; then
              echo "::error::no tag - dispatch this with the tag to publish"
              exit 1
            fi
            args=(--tag "$REQUESTED")
          fi
          # Run the trusted default-branch discovery before checking out the tag.
          # It resolves SemVer precedence, validates the exact tag ref and ancestry,
          # and never reads package.json or contacts the registry.
          node "$GITHUB_WORKSPACE/release.mjs" --repo-dir "$PWD" --discover-publish --branch HEAD --output "$GITHUB_OUTPUT" "${args[@]}"
          # npm version strips SemVer build metadata. Never publish a tag under a
          # different version than the one discovered.
          if grep -Eq '^version=.*\+' "$GITHUB_OUTPUT"; then
            echo "::error::npm cannot preserve build metadata in a release version"
            exit 1
          fi

      - name: Check out the tag
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: git checkout -q "refs/tags/$TAG"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Pin npm for audit integration tests and trusted publishing
        if: steps.tag.outputs.skip != 'true'
        run: |
          npm install --global --ignore-scripts npm@11.6.2
          npm --version

      - name: npm can do trusted publishing
        if: steps.tag.outputs.skip != 'true'
        # OIDC publishing needs npm 11.5.1 or later; an older CLI looks for a
        # token instead, and fails with a message about authentication rather
        # than about the version
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "::error::npm $version cannot do trusted publishing - needs 11.5.1 or later"
            exit 1
          fi

      - name: The suite passes at this tag
        if: steps.tag.outputs.skip != 'true'
        run: node --test

      # Discovery runs on trusted main before checkout; preparation runs the tag's
      # own implementation and must prove that it returned the expected contract.
      - name: Prepare publish
        id: prepare
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          set -euo pipefail
          prepare_output="$(mktemp)"
          trap 'rm -f "$prepare_output"' EXIT
          args=(--prepare-publish --tag "$TAG" --branch HEAD --output "$prepare_output")
          if [ "${REPUBLISH:-false}" = "true" ]; then args+=(--republish); fi
          node release.mjs "${args[@]}"
          # A historical CLI can silently ignore this mode and exit zero. Do not
          # trust the exit code or let it inject unrelated GitHub output commands.
          node - "$prepare_output" "$TAG" "$VERSION" "${REPUBLISH:-false}" <<'NODE'
          const fs = require('node:fs')
          const [path, tag, version, republish] = process.argv.slice(2)
          const lines = fs.readFileSync(path, 'utf8').trimEnd().split('\n')
          const expected = ['skip', 'tag', 'version', 'publish', 'exists']
          const pairs = lines.map((line) => {
            const i = line.indexOf('=')
            return i < 0 ? [line, ''] : [line.slice(0, i), line.slice(i + 1)]
          })
          const data = Object.fromEntries(pairs)
          if (pairs.length !== expected.length || expected.some((key) => pairs.filter(([k]) => k === key).length !== 1) ||
              data.skip !== 'false' || data.tag !== tag || data.version !== version ||
              !['true', 'false'].includes(data.publish) || !['true', 'false'].includes(data.exists) ||
              !['true', 'false'].includes(republish) || (data.publish === 'true') !== (data.exists === 'false' || republish === 'true')) {
            console.error('::error::invalid prepare publish output from tagged CLI')
            process.exit(1)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${data.publish}\n`)
          NODE

      # prepare-publish stamps package.json; npm also updates a lockfile when
      # one exists. Do this only after checking out the tag and preparing it.
      - name: Synchronize the lockfile version
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        if: steps.tag.outputs.skip != 'true' && steps.prepare.outputs.publish == 'true'
        run: npm publish --access public
        # no NODE_AUTH_TOKEN: the OIDC token is exchanged for a short-lived
        # credential, so there is no long-lived secret in this repository
